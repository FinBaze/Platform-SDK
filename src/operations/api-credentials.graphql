query SdkProfileApiCredentials($profileId: ID!) {
  profileApiCredentials(profileId: $profileId) {
    id
    clientId
    name
    created
    updated
  }
}

mutation SdkCreateProfileApiCredential(
  $profileId: ID!
  $input: CreateApiCredentialInput
) {
  createProfileApiCredential(profileId: $profileId, input: $input) {
    id
    clientId
    clientSecret
    name
    created
    updated
  }
}

mutation SdkRotateProfileApiCredential($profileId: ID!, $id: ID!) {
  rotateProfileApiCredential(profileId: $profileId, id: $id) {
    id
    clientId
    clientSecret
    name
    created
    updated
  }
}

mutation SdkRevokeProfileApiCredential($profileId: ID!, $id: ID!) {
  revokeProfileApiCredential(profileId: $profileId, id: $id)
}

