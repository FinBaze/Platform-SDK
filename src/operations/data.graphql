# Wave 3: data in and out. Hand-written documents for the platform data API.

fragment SdkUpsertFields on UpsertPayload {
  status
  id
  externalId
}

mutation SdkUpsertRelation($input: UpsertRelationInput!) { upsertRelation(input: $input) { ...SdkUpsertFields } }
mutation SdkUpsertProduct($input: UpsertProductInput!) { upsertProduct(input: $input) { ...SdkUpsertFields } }
mutation SdkUpsertProject($input: UpsertProjectInput!) { upsertProject(input: $input) { ...SdkUpsertFields } }
mutation SdkUpsertCostCenter($input: UpsertCostCenterInput!) { upsertCostCenter(input: $input) { ...SdkUpsertFields } }
mutation SdkUpsertSalesInvoice($input: UpsertSalesInvoiceInput!) { upsertSalesInvoice(input: $input) { ...SdkUpsertFields } }
mutation SdkUpsertPurchaseInvoice($input: UpsertPurchaseInvoiceInput!) { upsertPurchaseInvoice(input: $input) { ...SdkUpsertFields } }
mutation SdkUpsertJournalEntry($input: UpsertJournalEntryInput!) { upsertJournalEntry(input: $input) { ...SdkUpsertFields } }
mutation SdkUpsertEmployee($input: UpsertEmployeeInput!) { upsertEmployee(input: $input) { ...SdkUpsertFields } }
mutation SdkUpsertEmployment($input: UpsertEmploymentInput!) { upsertEmployment(input: $input) { ...SdkUpsertFields } }

mutation SdkSetObjectMetadata($type: PlatformObjectType!, $id: ID!, $metadata: JSON!) {
  setObjectMetadata(type: $type, id: $id, metadata: $metadata)
}

query SdkPlatformObjectByExternalId($company: CompanyRef!, $type: PlatformObjectType!, $externalId: String!) {
  platformObjectByExternalId(company: $company, type: $type, externalId: $externalId) {
    type
    id
    externalId
    deleted
  }
}

fragment SdkBulkJobFields on PlatformBulkJob {
  id
  objectType
  mode
  status
  lineCount
  processedCount
  createdCount
  updatedCount
  unchangedCount
  skippedCount
  failedCount
  dryRun
  emitEvents
  created
  startedAt
  finishedAt
  error
}

query SdkPlatformBulkJob($id: ID!, $first: Int! = 500, $after: String, $status: [String!]) {
  platformBulkJob(id: $id) {
    ...SdkBulkJobFields
    results(first: $first, after: $after, status: $status) {
      nodes {
        line
        status
        companyId
        objectId
        externalId
        error {
          code
          message
          path
        }
      }
      endCursor
      hasNextPage
    }
  }
}

query SdkPlatformBulkJobs($first: Int! = 20, $after: String, $status: [PlatformBulkJobStatus!]) {
  platformBulkJobs(first: $first, after: $after, status: $status) {
    nodes {
      ...SdkBulkJobFields
    }
    endCursor
    hasNextPage
  }
}

mutation SdkCancelPlatformBulkJob($id: ID!) {
  cancelPlatformBulkJob(id: $id) {
    ...SdkBulkJobFields
  }
}

