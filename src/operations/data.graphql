      apiVersion
      sequence
      created
      occurredAt
      company {
        id
        externalId
      }
      objectType
      objectId
      data
      requestId
    }
    endCursor
    hasNextPage
  }
}

query SdkPlatformEvent($id: ID!) {
  platformEvent(id: $id) {
    id
