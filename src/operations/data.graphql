query SdkBankTransactionBookings($company: CompanyRef!, $externalIds: [String!]!) {
  bankTransactionBookings(company: $company, externalIds: $externalIds) {
    externalId
    transactionId
    booking {
      status
      counterpart {
        type
        id
        externalId
        label
      }
      ledger {
        code
        name
      }
      legs {
        ledgerCode
        ledgerName
        debitMinor
        creditMinor
      }
      taxCode
      vatAmountMinor
      category {
        key
        label
      }
      receipt {
        status
        documentIds
        requestedAt
      }
      bookedAt
      bookedBy
      reviewReason
    }
  }
}

